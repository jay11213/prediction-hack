<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinGo Prediction Dashboard</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 800px;
            margin: 0 auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card h3 {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: #94a3b8;
        }

        .stat-card .value {
            font-size: 20px;
            font-weight: bold;
        }

        .signal-box {
            background: #0ea5e9;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .signal-box h2 {
            margin: 0;
            font-size: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th {
            color: #94a3b8;
            font-size: 13px;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }

        .status-badge.win {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .status-badge.loss {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="stats-grid">
            <div class="stat-card">
                <h3>WIN RATE</h3>
                <div id="win-rate" class="value">0%</div>
            </div>
            <div class="stat-card">
                <h3>JACKPOTS</h3>
                <div id="jackpots-count" class="value">0</div>
            </div>
            <div class="stat-card">
                <h3>TOTAL</h3>
                <div id="total-count" class="value">0</div>
            </div>
        </div>

        <div class="stat-card" style="margin-bottom: 15px;">
            <h3>CURRENT PERIOD</h3>
            <div id="current-period" class="value">—</div>
        </div>

        <div class="signal-box">
            <h3>MODEL SIGNAL</h3>
            <h2 id="model-signal">—</h2>
        </div>

        <h2>Result history</h2>
        <table>
            <thead>
                <tr>
                    <th>Period</th>
                    <th>Actual</th>
                    <th>Prediction</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="history-table-body">
                <!-- Dynamic rows populated by app.js -->
            </tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
